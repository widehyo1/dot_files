# https://github.com/kiyoon/dotfiles/blob/master/tmux/.tmux.conf
set -g prefix C-t
unbind C-b


# passthrough OSC52 clipboard copy
set -g allow-passthrough on
set -g set-clipboard on

# Vim-style scrollback navigation
bind-key C-t copy-mode
setw -g mode-keys vi

# Character, line, and rectangular selections
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X begin-selection \; send-keys -X rectangle-toggle

# Copy to the tmux buffer and macOS clipboard, then exit copy mode
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel /usr/bin/pbcopy
bind-key -T copy-mode-vi Escape send-keys -X clear-selection
bind-key -T copy-mode-vi q send-keys -X cancel

# Reload configuration with prefix + r
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

